name: Contexts demo
on: [push]

env:
  project: "roboshop"
  component: "catalogue"
  environment: "dev"
jobs:
  github-context:
    runs-on: ubuntu-latest
    steps:
      - name: print github info
        run: |
          echo "${{ toJson(github) }}"
          echo "branch name: ${{ github.ref_name }}"
      - name: print environment variables
        run: |
          echo "project name: $project"
          echo "component name: $component"
          echo "environment name: $environment"