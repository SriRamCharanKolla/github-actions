name: Contexts demo
on: [push]

env:
  project: "roboshop"
  component: "catalogue"
  environment: "dev"
jobs:
  github-context:
    runs-on: ubuntu-latest
    outputs:
      image-name: ${{ steps.tag.outputs.image-name }}
      image-version: ${{ steps.tag.outputs.version }}
    steps:
      - name: print github info
        run: |
          echo "${{ toJson(github) }}"
          echo "branch name: ${{ github.ref_name }}"

      - name: print environment variables
        run: |
          echo "project name: $project"
          echo "component name: $component"
          echo "environment name: $environment"

      - name: print secrets
        run: |
          echo "DB user name: ${{ secrets.DB_USER }}"
          echo "DB password: ${{ secrets.DB_PASSWORD }}"

      - name: print variables
        run: |
          echo "DB URL: ${{ vars.DB_URL }}"

      - name: image tag
        id: tag # id is mandatory to access the value of a step in the subsequent steps
        run: |
          echo "version=1.0.0" >> $GITHUB_OUTPUT
          echo "image-name=catalogue" >> $GITHUB_OUTPUT
      
      - name: print previous steps output
        run: |
          echo "Image name: ${{ steps.tag.outputs.image-name }}"
          echo "Version: ${{ steps.tag.outputs.version }}"

      # useful with in the job
      - name: github env
        run: |
          echo "Course=github actions" >> $GITHUB_ENV
          echo "Duration=5hours" >> $GITHUB_ENV

      - name: print github env
        run: |
          echo "Course name: $Course"
          echo "Course duration: $Duration"

  deploy:
    runs-on: ubuntu-latest
    needs: github-context # means depends on github-context job
    steps:
      - name: print github env in other job
        # run: |
        #   echo "Course name: $Course"
        #   echo "Course duration: $Duration"
        run: |
          echo "Image name: ${{ needs.github-context.outputs.image-name }}"
          echo "Image version: ${{ needs.github-context.outputs.image-version}}"

  scan:
    runs-on: ubuntu-latest
    steps:
      - name: run sonar scan
        run: echo "Sonar Scan"

      - name: print job Contexts
        run: echo "${{ toJson(job) }}"

      - name: print runner Contexts
        run: echo "${{ toJson(runner) }}"