name: Build Android APK

on:
  push:
    branches:
      - '**' # Triggers automatically on pushes to ANY branch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ionic-capacitor-app

jobs:
  build-android-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ionic-capacitor-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --watch=false

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: devops-mobile-debug-apk-${{ github.sha }}
          path: ionic-capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Send APK Build to Email Recipients
        if: success() # Only send if all previous build steps succeeded
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚀 Android APK Build Successful [Branch: ${{ github.ref_name }}]"
          to: ramcharankola@gmail.com,ramcharankola2@gmail.com
          from: "GitHub Actions CI <${{ secrets.MAIL_USERNAME }}>"
          body: |
            Hi Team,

            The Android APK build has completed successfully!

            📌 Build Summary:
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Author: ${{ github.actor }}
            - Repository: ${{ github.repository }}
            - Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The generated debug APK file is attached to this email.

            Best regards,
            DevOps CI/CD Automation
          attachments: ionic-capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk

