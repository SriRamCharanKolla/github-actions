name: Build Android APK

on:
  push:
    branches:
      - '**' # Triggers automatically on pushes to ANY branch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ionic-capacitor-app

jobs:
  build-android-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ionic-capacitor-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --watch=false

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: devops-mobile-debug-apk-${{ github.sha }}
          path: ionic-capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Send APK Build to Email Recipients
        if: success() # Only send if all previous build steps succeeded
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚀 Android APK Build Ready [Branch: ${{ github.ref_name }}]"
          to: ramcharankola@gmail.com,ramcharankola2@gmail.com
          from: "GitHub Actions CI <${{ secrets.MAIL_USERNAME }}>"
          html_body: |
            <div style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px;">
              <h2 style="color: #2da44e; margin-top: 0;">🚀 Android Debug APK Build Successful</h2>
              <p>Hi Team,</p>
              <p>The Android APK build has completed successfully on GitHub Actions CI!</p>
              
              <table style="width: 100%; border-collapse: collapse; margin: 15px 0;">
                <tr style="background-color: #f6f8fa;">
                  <td style="padding: 8px; border: 1px solid #d0d7de;"><strong>Branch</strong></td>
                  <td style="padding: 8px; border: 1px solid #d0d7de;"><code>${{ github.ref_name }}</code></td>
                </tr>
                <tr>
                  <td style="padding: 8px; border: 1px solid #d0d7de;"><strong>Commit</strong></td>
                  <td style="padding: 8px; border: 1px solid #d0d7de;"><code>${{ github.sha }}</code></td>
                </tr>
                <tr style="background-color: #f6f8fa;">
                  <td style="padding: 8px; border: 1px solid #d0d7de;"><strong>Triggered By</strong></td>
                  <td style="padding: 8px; border: 1px solid #d0d7de;">${{ github.actor }}</td>
                </tr>
                <tr>
                  <td style="padding: 8px; border: 1px solid #d0d7de;"><strong>Repository</strong></td>
                  <td style="padding: 8px; border: 1px solid #d0d7de;">${{ github.repository }}</td>
                </tr>
              </table>

              <div style="text-align: center; margin: 25px 0;">
                <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 
                   style="background-color: #2da44e; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-block;">
                  📥 Download APK from Workflow Artifacts
                </a>
              </div>

              <p style="font-size: 12px; color: #6e7781; border-top: 1px solid #e1e4e8; padding-top: 12px;">
                💡 <em>Note: Direct .apk file attachments are blocked by Google's email security policy (Error 552). The link above allows you to download the packaged APK directly from GitHub.</em>
              </p>
            </div>

